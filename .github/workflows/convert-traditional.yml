name: Convert repository text to Traditional Chinese

on:
  workflow_dispatch:
  push:
    branches:
      - traditional-chinese
    paths:
      - '.github/workflows/convert-traditional.yml'
      - 'scripts/convert_to_traditional.py'

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: traditional-chinese
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenCC
        run: python -m pip install opencc-python-reimplemented
      - name: Convert text files and correct source attribution
        run: python scripts/convert_to_traditional.py
      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CONTRIBUTING.md data itineraries maps places sources
          if git diff --cached --quiet; then
            echo "No conversion changes."
          else
            git commit -m "Convert repository content to Traditional Chinese"
            git push origin traditional-chinese
          fi
